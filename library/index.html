<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Library</title>
<style>
  :root{--bg:#0e1116;--panel:#151a21;--line:#242c37;--ink:#e7ecf3;--mut:#8b98a9;--accent:#3b82f6;--ok:#22c55e;--bad:#ef4444}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
  button{font:inherit;cursor:pointer}
  .lock{min-height:100dvh;display:grid;place-items:center;padding:24px}
  .lockbox{width:min(380px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:26px}
  .lockbox h1{margin:0 0 4px;font-size:19px}
  .lockbox p{margin:0 0 18px;color:var(--mut);font-size:13px}
  .lockbox input{width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--line);background:#0b0e13;color:var(--ink);font:inherit;outline:none}
  .lockbox input:focus{border-color:var(--accent)}
  .lockbox button{width:100%;margin-top:10px;padding:11px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-weight:700}
  .lockbox button:disabled{opacity:.55}
  .err{color:var(--bad);font-size:13px;margin-top:10px;min-height:18px}
  #app{min-height:100dvh}
</style>
</head>
<body>
<div id="app">
  <div class="lock">
    <form class="lockbox" id="lockform">
      <h1>Clip Library</h1>
      <p>Enter the password to unlock.</p>
      <input id="pw" type="password" autocomplete="current-password" autofocus placeholder="Password" />
      <button id="go" type="submit">Unlock</button>
      <div class="err" id="err"></div>
    </form>
  </div>
</div>

const SALT_B64 = "ARa2SzgScC2BEo1beDC8Qw==";
const IV_B64 = "fw1m2MjftW+M1KxE";
const ITER = 600000;
const API = "https://q2cqrhy710.execute-api.us-east-1.amazonaws.com/";

const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

async function deriveKey(password, salt) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt, iterations: ITER, hash: "SHA-256" },
    base,
    { name: "AES-GCM", length: 256 },
    // NOT extractable: once derived, the key can be stored and used but never
    // read back out — not by a later script, not by an extension.
    false,
    ["decrypt"]
  );
}

function idbKV(mode, fn) {
  return new Promise((res, rej) => {
    const r = indexedDB.open("pcr-library", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("kv");
    r.onsuccess = () => {
      const tx = r.result.transaction("kv", mode);
      const out = fn(tx.objectStore("kv"));
      tx.oncomplete = () => res(out && out.result);
      tx.onerror = () => rej(tx.error);
    };
    r.onerror = () => rej(r.error);
  });
}

// TWO GATES, AND THEY ARE NOT THE SAME GATE.
//
// The AES key unlocks the CODE — it is what stops a stranger reading the app
// out of a public file. The API token unlocks the DATA, and only the server can
// issue it. Cracking the file offline would reveal the interface and nothing
// else: every video still sits behind a password check that happens in AWS,
// where an attacker cannot grind at it unobserved.
async function decryptApp(key) {
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(IV_B64) }, key, b64(PAYLOAD));
  (0, eval)(new TextDecoder().decode(plain));
}

async function login(password) {
  const r = await fetch(API, {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ op: "login", password }),
  });
  if (!r.ok) throw new Error("rejected");
  return (await r.json()).token;
}

async function unlockWith(key, password, token) {
  await decryptApp(key);
  const t = token || (await login(password));
  localStorage.setItem("pcrToken", t);
  await window.__BOOT__(t);
}

const form = document.getElementById("lockform");
const err = document.getElementById("err");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("go");
  btn.disabled = true;
  err.textContent = "";
  try {
    const pw = document.getElementById("pw").value;
    const key = await deriveKey(pw, b64(SALT_B64));
    await unlockWith(key, pw);
    // Remembered so the password is typed once per browser, not once per visit.
    // Stored as a non-extractable CryptoKey — the password itself is never kept.
    try { await idbKV("readwrite", (s) => s.put(key, "unlockKey")); } catch {}
  } catch (e2) {
    err.textContent = "Wrong password.";
    btn.disabled = false;
  }
});

// Already unlocked in this browser? One click, no typing.
//
// The AES key is kept (non-extractable, so it can be used but never read back)
// and so is the API token. Neither is the password: the password itself is
// never stored anywhere. If the token has expired the click falls back to
// asking for it, which is the only time it is needed again.
(async () => {
  try {
    const key = await idbKV("readonly", (s) => s.get("unlockKey"));
    if (!key) return;
    const btn = document.getElementById("go");
    btn.textContent = "Open library";
    document.getElementById("pw").style.display = "none";
    document.querySelector(".lockbox p").textContent = "Unlocked on this Mac. Click to open.";
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      try {
        await unlockWith(key, null, localStorage.getItem("pcrToken"));
      } catch {
        // Token expired or the server said no — fall back to typing it.
        localStorage.removeItem("pcrToken");
        err.textContent = "Session expired — enter the password.";
        document.getElementById("pw").style.display = "";
        btn.textContent = "Unlock";
      }
    }, { capture: true });
  } catch {}
})();
</script>
</body>
</html>
